plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'confluent'
        url = 'https://packages.confluent.io/maven/'
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-json'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.apache.kafka:kafka-clients:4.2.0'
    implementation 'io.confluent:kafka-avro-serializer:8.2.0'
    implementation 'io.confluent:kafka-protobuf-serializer:8.2.0'
    implementation 'io.confluent:kafka-json-serializer:8.2.0'
    implementation 'io.confluent:kafka-json-schema-serializer:8.2.0'
    implementation 'io.confluent:kafka-json-schema-provider:8.2.0'
    implementation 'io.confluent:kafka-protobuf-provider:8.2.0'

    implementation 'com.google.protobuf:protobuf-java:4.33.4'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

bootJar {
    archiveFileName = "${rootProject.name}-${version}.jar"
}
